# VPS deploy: Traefik is the only ingress (no published host port), and the
# database gets a real password. Symlinked to the repo root on the server so
# `docker compose` picks it up automatically. Values come from the root .env.
services:
  doop:
    ports: !reset []
    environment:
      DATABASE_URL: postgres://doop:${POSTGRES_PASSWORD}@db:5432/doop
      SECRETS_ENCRYPTION_KEYS: ${SECRETS_ENCRYPTION_KEYS}
      TRUSTED_ORIGINS: https://${DOOP_HOST}
      # this instance has no background library of its own: borrow doop.design's
      BACKGROUNDS_ORIGIN: ${BACKGROUNDS_ORIGIN:-https://doop.design}
      # optional agent search keys, read from the root .env when set
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      BRANDFETCH_CLIENT_ID: ${BRANDFETCH_CLIENT_ID:-}
      SIGNUP_REQUIRES_APPROVAL: ${SIGNUP_REQUIRES_APPROVAL:-false}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-}
    labels:
      traefik.enable: 'true'
      traefik.http.routers.doop.rule: Host(`${DOOP_HOST}`)
      traefik.http.routers.doop.entrypoints: websecure
      traefik.http.routers.doop.tls.certresolver: letsencrypt
      traefik.http.services.doop.loadbalancer.server.port: '4400'
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
